[project]
site_name = "ACE Documentation"
site_description = "Documentation for ACE, the AI Companion for Education."
site_author = "ACE Contributors"
site_url = "https://rbijo.github.io/ace.app/"

repo_url = "https://github.com/rbijo/ace.app"
repo_name = "rbijo/ace.app"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Overview" = "getting-started/index.md" },
  ]},
  { "Architecture" = [
    { "System Architecture" = "architecture/index.md" },
  ]},
  { "Development" = [
    { "Development Setup" = "development/index.md" },
  ]},
  { "Backend" = [
    { "Overview" = "backend/index.md" },
  ]},
  { "Frontend" = [
    { "Overview" = "frontend/index.md" },
  ]},
  { "Database" = [
    { "Overview" = "database/index.md" },
  ]},
  { "AI Integration" = [
    { "Overview" = "ai/index.md" },
  ]},
  { "Deployment" = [
    { "Overview" = "deployment/index.md" },
  ]},
  { "Contributing" = [
    { "Contribution Guide" = "contributing/index.md" },
  ]},
]

[project.theme]
language = "en"

features = [
  "content.action.edit",
  "content.code.copy",
  "content.code.select",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}